# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: samaksh-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
